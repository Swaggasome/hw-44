---
# ==================== NAMESPACES ====================
apiVersion: v1
kind: Namespace
metadata:
  name: dev-environment
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging-environment
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod-environment

---
# ==================== PODS (в разных namespaces) ====================
apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
  namespace: dev-environment
  labels:
    app: debug
    env: dev
spec:
  containers:
  - name: alpine
    image: alpine:latest
    command: ["sleep", "infinity"]
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: staging-environment
  labels:
    app: nginx
    env: staging
spec:
  containers:
  - name: nginx
    image: nginx:1.25
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

---
apiVersion: v1
kind: Pod
metadata:
  name: busybox-pod
  namespace: prod-environment
  labels:
    app: busybox
    env: prod
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sleep", "3600"]
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

---
# ==================== DEPLOYMENT ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
  namespace: dev-environment
  labels:
    app: web-app
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"

---
# ==================== STATEFULSET ====================
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-statefulset
  namespace: staging-environment
spec:
  serviceName: "mysql"
  replicas: 2
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "root123"
        - name: MYSQL_DATABASE
          value: "testdb"
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi

---
# ==================== DAEMONSET ====================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-collector
  namespace: prod-environment
  labels:
    app: fluentd
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      containers:
      - name: fluentd
        image: fluent/fluentd:v1.16
        env:
        - name: FLUENTD_CONF
          value: "kubernetes.conf"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: fluentd-config-volume
          mountPath: /fluentd/etc
        - name: varlog
          mountPath: /var/log
        - name: dockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
      volumes:
      - name: fluentd-config-volume 
        configMap:
          name: fluentd-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: dockercontainers
        hostPath:
          path: /var/lib/docker/containers

---
# ==================== JOB ====================
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-job
  namespace: staging-environment
spec:
  template:
    spec:
      containers:
      - name: migration
        image: alpine:3.20
        command: ["echo", "Database migration completed successfully"]
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        imagePullPolicy: IfNotPresent
      restartPolicy: Never
  backoffLimit: 3

---
# ==================== CRONJOB ====================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-job
  namespace: prod-environment
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: alpine:latest
            command: ["echo", "Starting backup..."]
          restartPolicy: OnFailure

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: prod-environment
data:
  kubernetes.conf: |
    <system>
      log_level info
    </system>

    <source>
      @type tail
      path /var/log/containers/*.log
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type json
        time_key time
        time_format %Y-%m-%dT%H:%M:%S.%NZ
      </parse>
    </source>

    <match **>
      @type stdout
    </match>
